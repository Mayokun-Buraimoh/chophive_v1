<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify your ChopHive account</title>
</head>
<body style="font-family: Arial, sans-serif; background-color:#f7f7f7; padding:20px;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">
                <table width="500" cellpadding="20" cellspacing="0" style="background:#ffffff; border-radius:8px;">
                    
                    <tr>
                        <td align="center">
                            <h2 style="color:#000;">Welcome to ChopHive 👋</h2>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <p>Hello <strong>{{ username }}</strong>,</p>

                            <p>
                                Thanks for creating a ChopHive account.
                                Please verify your email address to activate your account.
                            </p>

                            <p style="text-align:center; margin:30px 0;">
                                <a href="{{ verify_url }}"
                                   style="
                                   background:#000;
                                   color:#fff;
                                   padding:12px 20px;
                                   text-decoration:none;
                                   border-radius:5px;
                                   display:inline-block;
                                   ">
                                    Verify Email
                                </a>
                            </p>

                            <p>
                                If you did not create this account, please ignore this email.
                            </p>

                            <p style="margin-top:30px;">
                                Cheers,<br>
                                <strong>ChopHive Team</strong>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
